name: Temporary signing secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: public-release

    steps:
      - name: Copy signing secrets to standalone repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MCP_MIGRATION_GH_TOKEN }}
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN"
          test -n "$SIGNING_PFX"
          test -n "$SIGNING_PASSWORD"

          printf '%s' "$SIGNING_PFX" |
            gh secret set WINDOWS_SIGNING_PFX_BASE64 \
              --repo iFael/mcp-access-stack-standalone \
              --env public-release

          printf '%s' "$SIGNING_PASSWORD" |
            gh secret set WINDOWS_SIGNING_PFX_PASSWORD \
              --repo iFael/mcp-access-stack-standalone \
              --env public-release

          echo "Signing secrets migrated successfully."
