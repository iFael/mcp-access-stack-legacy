name: Public release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - name: Require release secrets before publishing anything
        shell: bash
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PFX"
          test -n "$SIGNING_PASSWORD"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

  metadata:
    needs: signing-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      ci-run-id: ${{ steps.ci.outputs.run-id }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release identity
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$TAG_INPUT"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "$tag^{commit}")" = "$commit"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Require successful canonical main CI for exact release commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          run_id="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow CI \
              --branch main \
              --commit "$SOURCE_COMMIT" \
              --event push \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq 'sort_by(.databaseId) | last | .databaseId // empty'
          )"
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  package:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 30
    environment: public-release
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: pwsh
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows runtime
        run: npm run build

      - name: Build immutable Windows release
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
          CI_RUN_ID: ${{ needs.metadata.outputs.ci-run-id }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpRelease.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -BuildRunId ([long]$env:CI_RUN_ID) `
            -OutputDirectory (Join-Path $PWD "releases\$env:RELEASE_ID")

      - name: Build Windows execution-node native artifacts
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpWindowsExecutionNodeArtifacts.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'execution-node-native')

      - name: Assemble and sign minimal public distribution
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/New-McpPublicDistribution.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -SourceCommit $env:SOURCE_COMMIT `
            -ReleaseTag $env:RELEASE_TAG `
            -BuildRunId ([long]$env:GITHUB_RUN_ID) `
            -ExecutionNodeNativeDirectory (Join-Path $env:RUNNER_TEMP 'execution-node-native') `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'public-distribution')

      - name: Validate signed Windows execution-node package
        timeout-minutes: 5
        env:
          RELEASE_ID: ${{ needs.metadata.outputs.version }}
        run: |
          pwsh -NoLogo -NoProfile -File deploy/windows/Test-McpWindowsExecutionNodePackage.ps1 `
            -ReleaseRoot (Join-Path $env:RUNNER_TEMP "public-distribution\stage\releases\$env:RELEASE_ID") `
            -OfflinePinnedAuthenticode

      - name: Upload signed release assets for publisher job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-assets-${{ needs.metadata.outputs.version }}
          path: |
            ${{ runner.temp }}/public-distribution/${{ needs.metadata.outputs.tag }}-windows-x64.zip
            ${{ runner.temp }}/public-distribution/${{ needs.metadata.outputs.tag }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  edge:
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp-access-stack
        shell: bash
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-access-stack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve expected Edge contract revision
        id: edge-contract
        run: |
          set -euo pipefail
          expected="$(node -e 'const fs=require("node:fs"); const source=fs.readFileSync("services/mcp-edge-gateway/src/generated/mcp-tool-manifest.ts","utf8"); const match=source.match(/"contractRevision": "([0-9a-f]{64})"/); if(!match) process.exit(1); process.stdout.write(match[1]);')"
          test -n "$expected"
          echo "revision=$expected" >> "$GITHUB_OUTPUT"

      - name: Preflight contract rollout compatibility
        env:
          EXPECTED_CONTRACT_REVISION: ${{ steps.edge-contract.outputs.revision }}
          EDGE_HEALTH_URL: https://mcp-access-stack.rafaeldamasio77.workers.dev/health
        run: |
          set -euo pipefail
          current_health="$(curl --fail --silent --show-error "$EDGE_HEALTH_URL")"
          service="$(jq -r '.service // empty' <<<"$current_health")"
          current_expected="$(jq -r '.expectedContractRevision // empty' <<<"$current_health")"
          active_revision="$(jq -r '.activeContractRevision // empty' <<<"$current_health")"
          candidate_revision="$(jq -r '.candidateContractRevision // empty' <<<"$current_health")"
          if [[ "$service" != "mcp-edge-gateway" || -z "$current_expected" ]]; then
            echo "Current Edge health is not a valid rollout authority." >&2
            echo "$current_health" >&2
            exit 1
          fi
          if [[ "$current_expected" != "$EXPECTED_CONTRACT_REVISION" ]]; then
            if [[ -z "$active_revision" || "$active_revision" != "$current_expected" ]]; then
              echo "Contract-changing release requires rollout infrastructure from the previous stable Edge before deploy." >&2
              echo "currentExpected=$current_expected active=$active_revision next=$EXPECTED_CONTRACT_REVISION" >&2
              exit 1
            fi
            if [[ -n "$candidate_revision" ]]; then
              echo "Contract-changing release refused because another candidate contract is still prepared: $candidate_revision" >&2
              exit 1
            fi
          fi
          echo "Edge rollout preflight passed: current=$current_expected active=$active_revision next=$EXPECTED_CONTRACT_REVISION"

      - name: Prepare exact Edge contract in production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace @mcp-access-stack/edge-gateway

      - name: Verify prepared Edge contract before publication
        env:
          EXPECTED_CONTRACT_REVISION: ${{ steps.edge-contract.outputs.revision }}
          EDGE_HEALTH_URL: https://mcp-access-stack.rafaeldamasio77.workers.dev/health
        run: |
          set -euo pipefail
          last_health=''
          for attempt in $(seq 1 12); do
            if last_health="$(curl --fail --silent --show-error "$EDGE_HEALTH_URL")"; then
              actual_revision="$(jq -r '.expectedContractRevision // empty' <<<"$last_health")"
              active_revision="$(jq -r '.activeContractRevision // empty' <<<"$last_health")"
              candidate_revision="$(jq -r '.candidateContractRevision // empty' <<<"$last_health")"
              control_plane_ready="$(jq -r '.controlPlaneReady // false' <<<"$last_health")"
              execution_plane_ready="$(jq -r '.executionPlaneReady // false' <<<"$last_health")"
              connector_ready="$(jq -r '.connectorReady // false' <<<"$last_health")"
              contract_compatible="$(jq -r '.contractCompatible // false' <<<"$last_health")"
              service="$(jq -r '.service // empty' <<<"$last_health")"
              rollout_ready=false
              if [[ "$active_revision" == "$EXPECTED_CONTRACT_REVISION" || "$candidate_revision" == "$EXPECTED_CONTRACT_REVISION" ]]; then
                rollout_ready=true
              fi
              connected_runtime_safe=true
              if [[ "$connector_ready" == "true" && ( "$contract_compatible" != "true" || "$execution_plane_ready" != "true" ) ]]; then
                connected_runtime_safe=false
              fi
              if [[ "$service" == "mcp-edge-gateway" && "$actual_revision" == "$EXPECTED_CONTRACT_REVISION" && "$control_plane_ready" == "true" && "$rollout_ready" == "true" && "$connected_runtime_safe" == "true" ]]; then
                echo "Edge contract prepared: expected=$actual_revision active=$active_revision candidate=$candidate_revision"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Edge contract prepare verification failed. Expected: $EXPECTED_CONTRACT_REVISION" >&2
          echo "$last_health" >&2
          exit 1

  publish:
    needs:
      - metadata
      - package
      - edge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: public-release-assets-${{ needs.metadata.outputs.version }}
          path: release-assets

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" --repo "$GITHUB_REPOSITORY"
